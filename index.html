<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hill Plots | Premium Himalayan Real Estate, Dehradun</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg: #0E1A1A;
            --surface: #142626;
            --primary: #0097b2;
            --accent: #C9A24D;
            --text-main: #F5F7F6;
            --text-soft: #A7B7B3;
        }

        html {
            scroll-behavior: smooth;
        }

        body { 
            background-color: var(--bg);
            color: var(--text-main);
            font-family: Georgia, 'Times New Roman', Times, serif;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .heading-serif {
            font-family: Georgia, serif;
        }

        @keyframes bounce-custom {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }
        .animate-bounce-custom {
            animation: bounce-custom 2s infinite;
        }

        /* Custom utility classes */
        .bg-hill-bg { background-color: var(--bg); }
        .bg-hill-surface { background-color: var(--surface); }
        .text-hill-primary { color: var(--primary); }
        .text-hill-accent { color: var(--accent); }
        .text-hill-soft { color: var(--text-soft); }
        .border-hill-surface { border-color: rgba(255,255,255,0.05); }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface); border-radius: 10px; border: 2px solid var(--bg); }
    </style>
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom": "https://esm.sh/react-dom@^19.2.3",
    "react-dom/client": "https://esm.sh/react-dom@^19.2.3/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/"
  }
}
</script>
</head>
<body class="bg-[#0E1A1A] text-[#F5F7F6]">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
        window.addEventListener('load', () => {
            if (window.lucide) window.lucide.createIcons();
        });
    </script>
</body>
</html>
